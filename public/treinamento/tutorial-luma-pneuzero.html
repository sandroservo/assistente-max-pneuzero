<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tutorial Luma — Pneuzero | Vídeo da Equipe</title>
<style>
  :root{
    --bg:#f4f5f7; --side:#0c1726; --side2:#10233a; --red:#e01b22; --red2:#ef3a3a;
    --text:#1f2937; --muted:#6b7280; --border:#e6e8ec; --green:#16a34a; --amber:#d97706;
    --blue:#2563eb; --purple:#7c3aed; --card:#ffffff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#0a0f17;color:var(--text);
    font-family:Inter,"Segoe UI",system-ui,-apple-system,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  #player{position:fixed;inset:0;display:flex;flex-direction:column}
  #stagewrap{flex:1;display:flex;align-items:center;justify-content:center;padding:18px;min-height:0}
  #stage{position:relative;width:100%;max-width:1280px;aspect-ratio:1568/744;background:var(--bg);
    border-radius:14px;overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.55);border:1px solid #1d2735}
  .app{position:absolute;inset:0;display:flex;font-size:13px}
  .sb{width:14.5%;min-width:150px;background:var(--side);color:#cbd5e1;display:flex;flex-direction:column;padding:10px}
  .logo{background:#0a131f;border:1px solid #1b2a3d;border-radius:14px;height:84px;margin:4px 4px 12px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
  .logo .l1{font-weight:800;letter-spacing:1px;font-size:11px;color:#fff}
  .logo .l2{font-weight:900;font-size:20px;color:#fff;line-height:1;display:flex;align-items:center;gap:4px}
  .logo .l2 b{color:var(--red2)}
  .sb .cap{font-size:8px;letter-spacing:1px;color:#5b6b80;margin:8px 6px 6px}
  .nav{display:flex;align-items:center;gap:9px;padding:8px 9px;border-radius:9px;color:#aeb9c7;font-weight:600;font-size:12px}
  .nav svg{width:15px;height:15px;flex:none;stroke:#9aa6b5;stroke-width:1.9;fill:none}
  .nav.active{background:var(--red);color:#fff}
  .nav.active svg{stroke:#fff}
  .sb .foot{margin-top:auto;display:flex;align-items:center;gap:8px;padding:9px;border:1px solid #1b2a3d;border-radius:10px}
  .sb .foot .av{width:26px;height:26px;border-radius:50%;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:11px}
  .sb .foot small{color:#7fd18b;font-size:9px}
  .sb .foot b{font-size:11px;color:#e5e7eb}
  .ct{flex:1;background:var(--bg);overflow:hidden;position:relative}
  .ct .pad{padding:16px 20px}
  .h1{font-size:20px;font-weight:800;margin:0;display:flex;align-items:center;gap:8px}
  .sub{color:var(--muted);font-size:12px;margin:2px 0 0}
  .row{display:flex;gap:12px}
  .grid{display:grid;gap:12px}
  .kpi{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:13px 15px;display:flex;align-items:center;gap:12px}
  .kpi .ic{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;flex:none}
  .kpi .big{font-size:21px;font-weight:800;line-height:1}
  .kpi .lbl{font-size:11px;color:var(--muted)}
  .card{background:var(--card);border:1px solid var(--border);border-radius:12px}
  .btnRed{background:var(--red);color:#fff;border:none;border-radius:9px;padding:8px 13px;font-weight:700;font-size:12px}
  .badge{font-size:9.5px;font-weight:700;padding:2px 7px;border-radius:20px;white-space:nowrap}
  .b-amber{background:#fef3c7;color:#92400e}.b-green{background:#dcfce7;color:#166534}
  .b-blue{background:#dbeafe;color:#1e40af}.b-red{background:#fee2e2;color:#991b1b}
  .b-gray{background:#eef1f4;color:#475569}.b-purple{background:#ede9fe;color:#5b21b6}
  .chip{font-size:11px;font-weight:600;padding:5px 11px;border-radius:20px;background:#fff;border:1px solid var(--border);color:#475569}
  .chip.on{background:var(--red);color:#fff;border-color:var(--red)}
  .scl{height:7px;border-radius:6px;background:#eef1f4;overflow:hidden}
  .scl > i{display:block;height:100%;background:var(--red)}
  .av{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:11px;flex:none}
  .hl{outline:3px solid var(--red);outline-offset:3px;border-radius:10px;
    box-shadow:0 0 0 6px rgba(224,27,34,.18),0 10px 30px rgba(224,27,34,.25);
    animation:pulse 1.4s ease-in-out infinite;position:relative;z-index:5}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 5px rgba(224,27,34,.15)}50%{box-shadow:0 0 0 11px rgba(224,27,34,.05)}}
  #cap{position:absolute;left:0;right:0;bottom:0;padding:16px 22px 18px;
    background:linear-gradient(to top,rgba(7,12,20,.92),rgba(7,12,20,.0));color:#fff;font-size:15px;line-height:1.45;
    min-height:74px;display:flex;align-items:flex-end}
  #cap span{max-width:980px}
  #scenebadge{position:absolute;top:12px;left:14px;background:rgba(7,12,20,.72);color:#fff;
    font-size:11px;font-weight:700;padding:5px 11px;border-radius:20px;letter-spacing:.3px;z-index:9}
  #bar{display:flex;align-items:center;gap:12px;padding:10px 16px;background:#0a0f17;color:#cbd5e1;border-top:1px solid #1b2533}
  #bar button{background:#16202e;color:#e5e7eb;border:1px solid #243042;border-radius:9px;padding:8px 12px;font-weight:700;font-size:13px;cursor:pointer}
  #bar button:hover{background:#1d2a3a}
  #bar button.primary{background:var(--red);border-color:var(--red);color:#fff}
  #prog{flex:1;height:7px;background:#1b2533;border-radius:6px;overflow:hidden}
  #prog > i{display:block;height:100%;width:0;background:var(--red);transition:width .25s}
  #tlabel{font-size:12px;color:#8b98a8;min-width:96px;text-align:right;font-variant-numeric:tabular-nums}
  #chapters{display:flex;gap:6px;overflow-x:auto;padding:8px 16px;background:#0a0f17;border-top:1px solid #11181f}
  #chapters .ch{font-size:11px;color:#9aa6b5;background:#121b27;border:1px solid #1d2735;padding:5px 9px;border-radius:7px;white-space:nowrap;cursor:pointer}
  #chapters .ch.cur{background:var(--red);color:#fff;border-color:var(--red)}
  #chapters .ch.done{color:#6b7280}
  #start{position:absolute;inset:0;background:rgba(7,12,20,.93);display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;color:#fff;z-index:30;padding:24px}
  #start h2{font-size:26px;margin:0 0 6px}
  #start p{color:#aeb9c7;max-width:520px;margin:6px 0 20px;line-height:1.5}
  #start .play{background:var(--red);border:none;color:#fff;width:78px;height:78px;border-radius:50%;font-size:30px;cursor:pointer;box-shadow:0 12px 40px rgba(224,27,34,.5)}
  #start .opts{margin-top:18px;display:flex;gap:14px;align-items:center;color:#cbd5e1;font-size:13px}
  #start label{display:flex;align-items:center;gap:7px;cursor:pointer}
  @media (max-width:680px){#cap{font-size:13px}#bar button{padding:7px 9px;font-size:12px}#tlabel{display:none}}
</style>
</head>
<body>
<div id="player">
  <div id="stagewrap">
    <div id="stage">
      <div id="scenebadge">—</div>
      <div class="app" id="app"></div>
      <div id="cap"><span id="captxt"></span></div>
      <div id="start">
        <h2>🏁 Tutorial da Luma — Pneuzero</h2>
        <p>Como usar a assistente de WhatsApp no dia a dia: atender, assumir conversas, mover o funil e aprovar agendamentos. Narrado em português. ~14 min.</p>
        <button class="play" id="bigplay" title="Iniciar">▶</button>
        <div class="opts" style="flex-wrap:wrap;justify-content:center">
          <label><input type="checkbox" id="voicechk" checked> Narração por voz</label>
          <label style="display:flex;align-items:center;gap:6px">Voz
            <select id="voicesel" style="background:#16202e;color:#e5e7eb;border:1px solid #243042;border-radius:6px;padding:4px 6px;font-size:12px;max-width:200px">
              <option value="">Auto (pt-BR)</option>
            </select>
          </label>
          <label style="display:flex;align-items:center;gap:6px">Velocidade
            <input type="range" id="ratesel" min="0.80" max="1.30" step="0.05" value="1.00" style="width:110px">
            <span id="ratelbl" style="font-variant-numeric:tabular-nums;min-width:38px">1.00x</span>
          </label>
          <span>•</span><span>Use ⏯ Espaço, ← →</span>
        </div>
      </div>
    </div>
  </div>
  <div id="bar">
    <button id="prev" title="Cena anterior">⏮</button>
    <button id="play" class="primary" title="Play/Pause">⏸</button>
    <button id="next" title="Próxima cena">⏭</button>
    <div id="prog"><i></i></div>
    <div id="tlabel">Cena 1/14</div>
    <button id="mute" title="Mudo">🔊</button>
  </div>
  <div id="chapters"></div>
</div>

<script>
const I = {
  dash:'<path d="M3 3h7v7H3zM14 3h7v7h-7zM14 14h7v7h-7zM3 14h7v7H3z"/>',
  chat:'<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
  team:'<circle cx="9" cy="7" r="3"/><path d="M2 21v-2a4 4 0 0 1 4-4h6a4 4 0 0 1 4 4v2M17 7a3 3 0 0 1 0 6"/>',
  cal:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
  contacts:'<rect x="4" y="3" width="16" height="18" rx="2"/><circle cx="12" cy="10" r="2.4"/><path d="M8 17a4 4 0 0 1 8 0"/>',
  kanban:'<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18M15 3v12"/>',
  book:'<path d="M4 5a2 2 0 0 1 2-2h12v17H6a2 2 0 0 0-2 2zM18 3v17"/>',
  users:'<circle cx="9" cy="8" r="3"/><path d="M3 20a6 6 0 0 1 12 0M16 4a3 3 0 0 1 0 8"/>',
  report:'<path d="M3 3v18h18"/><path d="M7 14v4M12 9v9M17 5v13"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>',
  fold:'<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/>'
};
function svg(p){return '<svg viewBox="0 0 24 24">'+p+'</svg>';}

const NAVITEMS = [
  ['dashboard','Dashboard',I.dash],['chats','Chats',I.chat],['equipe','Equipe',I.team],
  ['agendamentos','Agendamentos',I.cal],['contatos','Contatos',I.contacts],['kanban','Kanban',I.kanban],
  ['conhecimento','Conhecimento',I.book],['usuarios','Usuários',I.users],
  ['relatorios','Relatórios',I.report],['config','Configurações',I.gear]
];
function sidebar(active){
  let nav = NAVITEMS.map(n=>`<div class="nav ${n[0]===active?'active':''}" id="nav-${n[0]}">${svg(n[2])}<span>${n[1]}</span></div>`).join('');
  return `<div class="sb">
    <div class="logo"><div class="l1">AUTO CENTER</div><div class="l2">PNEU<b>ZERO</b> 🏁</div></div>
    <div class="nav" style="color:#8895a6">${svg(I.fold)}<span>Recolher</span></div>
    <div class="cap">MENU DE NAVEGAÇÃO</div>
    ${nav}
    <div class="foot"><div class="av">L</div><div><b>Luma Assistente</b><br><small>● Online</small></div></div>
  </div>`;
}
function frame(active, inner){ return sidebar(active) + `<div class="ct">${inner}</div>`; }
function avatar(txt,color){return `<div class="av" style="background:${color}">${txt}</div>`;}

const Screens = {
  dashboard(){return frame('dashboard',`<div class="pad">
    <div style="font-size:11px;color:#9aa6b5;margin-bottom:8px">Home › Dashboard</div>
    <div class="row" id="d-kpis" style="margin-bottom:12px">
      <div class="kpi" style="flex:1"><div class="ic" style="background:var(--blue)">👥</div><div><div class="big">5</div><div class="lbl">Total de Leads</div></div></div>
      <div class="kpi" style="flex:1"><div class="ic" style="background:#14b8a6">💬</div><div><div class="big">5</div><div class="lbl">Conversas</div></div></div>
      <div class="kpi" style="flex:1"><div class="ic" style="background:var(--amber)">🕑</div><div><div class="big">0</div><div class="lbl">Novos Leads</div></div></div>
    </div>
    <div class="row" id="d-kpis2" style="margin-bottom:14px">
      <div class="kpi" style="flex:1"><div class="ic" style="background:var(--green)">$</div><div><div class="big">R$ 0,00</div><div class="lbl">Vendas no mês</div></div></div>
      <div class="kpi" style="flex:1"><div class="ic" style="background:var(--amber)">★</div><div><div class="big">—</div><div class="lbl">NPS médio (mês)</div></div></div>
      <div class="kpi" style="flex:1"><div class="ic" style="background:var(--blue)">🔔</div><div><div class="big">0</div><div class="lbl">Follow-ups pendentes</div></div></div>
      <div class="kpi" style="flex:1"><div class="ic" style="background:var(--purple)">🚗</div><div><div class="big">7</div><div class="lbl">Veículos cadastrados</div></div></div>
    </div>
    <div class="row">
      <div class="card" style="flex:1.6;padding:14px" id="d-chart">
        <div style="display:flex;justify-content:space-between;align-items:center"><b>Clientes ativos</b><button class="btnRed">Ver conversas</button></div>
        <div style="font-size:11px;color:var(--muted);margin:8px 0 12px">🔴 5 novos leads (30d) &nbsp; ⚫ 230 mensagens (30d)</div>
        <svg viewBox="0 0 520 150" style="width:100%;height:120px">
          <polyline fill="none" stroke="#e01b22" stroke-width="2" points="0,120 60,118 120,119 200,90 280,95 340,60 400,70 460,30 520,40"/>
          <line x1="0" y1="140" x2="520" y2="140" stroke="#e5e7eb"/>
        </svg>
        <div style="font-size:10px;color:#9aa6b5;letter-spacing:1px;margin-top:6px">LEADS POR STATUS</div>
      </div>
      <div class="card" style="flex:1;padding:14px" id="d-atend">
        <b>Atendimento</b>
        <div style="display:flex;flex-direction:column;gap:11px;margin-top:12px">
          <div style="display:flex;gap:9px;align-items:center">${avatar('GC','#0ea5e9')}<div><b style="font-size:12px">Gustavo Chaves</b><br><span style="font-size:10px;color:var(--muted)">Em atendimento</span></div></div>
          <div style="display:flex;gap:9px;align-items:center">${avatar('SS','#f59e0b')}<div><b style="font-size:12px">Sandro Servo</b><br><span style="font-size:10px;color:var(--muted)">Em atendimento</span></div></div>
          <div style="display:flex;gap:9px;align-items:center">${avatar('MT','#e01b22')}<div><b style="font-size:12px">Marcelo Torres</b><br><span style="font-size:10px;color:var(--muted)">Qualificado</span></div></div>
        </div>
        <button class="btnRed" style="width:100%;margin-top:12px;background:#fff;color:#334155;border:1px solid var(--border)">Ir para atendimento</button>
      </div>
    </div>
  </div>`);},

  chatsList(){return frame('chats', chatLayout(`
    <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:#9aa6b5;gap:10px">
      <div style="width:64px;height:64px;border-radius:50%;background:#fde2e2;display:flex;align-items:center;justify-content:center;font-size:26px">💬</div>
      <b style="color:#374151">Selecione uma conversa</b>
      <span style="font-size:12px">Escolha uma conversa na lista ao lado</span>
    </div>`));},

  chatThread(){return frame('chats', chatLayout(`
    <div style="display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border);background:#fff" id="c-head">
      ${avatar('GC','#e01b22')}
      <div><b>Gustavo Chaves</b> <span class="badge b-amber">Em Atendimento</span> <span class="badge b-red">170</span><br>
      <span style="font-size:11px;color:var(--muted)">📞 559991823241 · visto 12/06 19:19</span></div>
      <div style="margin-left:auto;display:flex;gap:8px" id="c-actions">
        <button class="chip" id="c-assumir" style="border-color:#fca5a5;color:#b91c1c">👥 Assumir</button>
        <button class="chip" style="border-color:#fde68a;color:#b45309">⏸ Parou responder</button>
      </div>
    </div>
    <div style="display:flex;gap:24px;padding:9px 16px;border-bottom:1px solid var(--border);font-size:12px;background:#fff">
      <b style="color:var(--red);border-bottom:2px solid var(--red);padding-bottom:6px">Conversa</b>
      <span style="color:var(--muted)">Detalhes</span><span style="color:var(--muted)">Anotações</span><span style="color:var(--muted)">Histórico</span>
    </div>
    <div style="flex:1;overflow:hidden;padding:14px 16px;display:flex;flex-direction:column;gap:10px" id="c-thread">
      <div style="align-self:flex-end;max-width:72%"><div style="background:var(--red);color:#fff;padding:9px 12px;border-radius:12px 12px 2px 12px;font-size:12px">Oi, Gustavo! 😊 Só passando pra ver se você ainda está por aqui. Alguma coisa nova?</div><div style="font-size:9px;color:#9aa6b5;text-align:right">Luma · 18:57 ✓✓</div></div>
      <div style="align-self:flex-start;max-width:60%"><div style="display:flex;gap:6px;align-items:flex-start"><div class="av" style="width:22px;height:22px;background:#cbd5e1;color:#475569">?</div><div style="background:#fff;border:1px solid var(--border);padding:9px 12px;border-radius:12px 12px 12px 2px;font-size:12px">Que msg?</div></div><div style="font-size:9px;color:#9aa6b5;margin-left:28px">Lead · 19:19</div></div>
      <div style="align-self:flex-end;max-width:72%"><div style="background:var(--red);color:#fff;padding:9px 12px;border-radius:12px 12px 2px 12px;font-size:12px">Prontinho, Gustavo! Vou encaminhar agora para nossos consultores confirmarem a disponibilidade desse horário 😊</div><div style="font-size:9px;color:#9aa6b5;text-align:right">Luma · 19:19 ✓✓</div></div>
    </div>
    <div style="padding:10px 16px;border-top:1px solid var(--border);background:#fff;display:flex;align-items:center;gap:10px" id="c-composer">
      <span style="font-size:16px">😊</span><span style="font-size:16px">📎</span><span style="font-size:16px">🖼️</span>
      <div style="flex:1;background:#f1f3f6;border-radius:20px;padding:9px 14px;color:#9aa6b5;font-size:12px">Digite uma mensagem...</div>
      <div class="av" style="background:var(--red)">🎤</div>
    </div>`,'gustavo'));},

  chatDetails(){return frame('chats', chatLayout(`
    <div style="display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border);background:#fff" id="c-head">
      ${avatar('GC','#e01b22')}<div><b>Gustavo Chaves</b> <span class="badge b-amber">Em Atendimento</span></div></div>
    <div style="display:flex;gap:24px;padding:9px 16px;border-bottom:1px solid var(--border);font-size:12px;background:#fff">
      <span style="color:var(--muted)">Conversa</span><b style="color:var(--red);border-bottom:2px solid var(--red);padding-bottom:6px">Detalhes</b>
      <span style="color:var(--muted)">Anotações</span><span style="color:var(--muted)">Histórico</span></div>
    <div style="flex:1;overflow:hidden;padding:16px 20px">
      <div style="font-weight:700;margin-bottom:10px">🔴 Dados do Lead</div>
      <div class="card" style="padding:11px 14px;margin-bottom:8px"><div style="font-size:9px;color:#9aa6b5">NOME</div><b>Gustavo Chaves</b></div>
      <div class="card" style="padding:11px 14px;margin-bottom:8px;display:flex;justify-content:space-between"><div><div style="font-size:9px;color:#9aa6b5">TELEFONE</div><b>559991823241</b></div><span style="color:var(--green)">✓</span></div>
      <div style="background:#fffbeb;border:1px solid #fde68a;border-radius:12px;padding:11px 14px;margin-bottom:14px"><div style="font-size:9px;color:#b45309">EMAIL</div><i style="color:#b45309;font-weight:700">Luma irá solicitar...</i></div>
      <div style="font-weight:700;margin-bottom:10px">Status &amp; Qualificação</div>
      <div class="card" style="padding:11px 14px;margin-bottom:10px"><div style="font-size:9px;color:#9aa6b5">STATUS DO LEAD</div><b>Em Atendimento ▾</b></div>
      <div id="c-score"><div style="font-size:9px;color:#9aa6b5;margin-bottom:5px">LEAD SCORE</div>
        <div class="scl"><i style="width:42%"></i></div><div style="text-align:right;font-weight:800;color:var(--red)">170</div></div>
    </div>`,null));},

  kanban(){
    const cols=[
      ['🆕 Novo Lead','0','#eef2ff',[]],
      ['🔍 Em Triagem','1','#fff7ed',[['Gustavo Chaves','Pneus para Gol 2014','170','(99) 9182-3241','11d']]],

    {say:'Tem muita coisa que a Luma faz sozinha. O follow-up de silêncio: cliente sumiu, ela cutuca em quinze minutos, quarenta e cinco, quatro horas e vinte e quatro horas. Quatro tentativas.',hl:'au-0'},
    {say:'O NPS pós-venda: um dia depois da venda ela pergunta a nota. Nota baixa, cai pra equipe recuperar o cliente.',hl:'au-1'},
    {say:'E ainda lembra o cliente antes do horário marcado, e manda parabéns no aniversário. A Luma trabalha 24 horas; você entra onde o humano faz diferença.',hl:'au-2'},
  ]},
  {nav:'relatorios',badge:'12 · Relatórios',render:Screens.relatorios,steps:[
    {say:'Por último, Relatórios. Aqui você vê o desempenho: mensagens recebidas e enviadas, transferências e leads por status, nos últimos 30 dias.',hl:'r-kpis'},
    {say:'E o desempenho por usuário: quem responde rápido e quem tá deixando cliente esperando. Tempo de resposta é dinheiro: cliente quente esfria em minutos.',hl:'r-users'},
  ]},
  {nav:'chats',badge:'13 · Rotina do dia',render:Screens.chatsList,steps:[
    {say:'A rotina do dia em três passos. Um: de manhã, olha o Dashboard e o chat da Equipe pra ver o que tá pegando.',hl:'nav-dashboard'},
    {say:'Dois: vai nos Chats, aba Aguardando, e assume quem precisa de humano.',hl:'c-aguard'},
    {say:'Três: mantém o Kanban atualizado arrastando os cards, e aprova os agendamentos que a Luma mandou.',hl:'nav-kanban'},
  ]},
  {nav:'dashboard',badge:'14 · Fechamento',render:Screens.dashboard,steps:[
    {say:'A Luma faz o trabalho pesado. Você faz o que máquina não faz: fechar e encantar o cliente.'},
    {say:'Qualquer dúvida, tem a tela de Conhecimento no menu, com material de apoio. Bom trabalho, equipe!',hl:'nav-conhecimento'},
  ]},
];

const app=document.getElementById('app'), cap=document.getElementById('captxt'),
  badge=document.getElementById('scenebadge'), prog=document.querySelector('#prog>i'),
  tlabel=document.getElementById('tlabel'), chapters=document.getElementById('chapters'),
  voiceSel=document.getElementById('voicesel'), rateSel=document.getElementById('ratesel'),
  rateLbl=document.getElementById('ratelbl');
let si=0, ti=0, playing=false, muted=false;
let availableVoices=[], chosenVoice=null;
let advTimer=null, gapTimer=null, currentUtter=null;

// ===== TTS =====
const SUPPORTED_TTS = 'speechSynthesis' in window && typeof SpeechSynthesisUtterance!=='undefined';
const GAP_SENTENCE_MS = 220;   // pausa entre frases dentro do step
const GAP_STEP_MS     = 450;   // pausa entre steps da mesma cena
const GAP_SCENE_MS    = 850;   // pausa ao trocar de cena
// Estimativa fallback (caracter/ms) — usada quando TTS não disponível ou muted
const FALLBACK_CHAR_MS = 55;

function getUseVoice(){ const c=document.getElementById('voicechk'); return c?c.checked:true; }
function getRate(){ return parseFloat(rateSel?.value||'1.0') || 1.0; }

function refreshVoices(){
  if(!SUPPORTED_TTS) return;
  const vs = speechSynthesis.getVoices();
  availableVoices = vs.filter(v=>/^pt/i.test(v.lang));
  if(!availableVoices.length){ availableVoices = vs.slice(); }
  if(voiceSel){
    const prev = voiceSel.value;
    voiceSel.innerHTML = '<option value="">Auto (melhor pt-BR)</option>' +
      availableVoices.map(v=>`<option value="${v.voiceURI}">${v.name} (${v.lang})</option>`).join('');
    if(prev) voiceSel.value = prev;
  }
  if(!chosenVoice){
    chosenVoice = availableVoices.find(v=>/pt[-_]BR/i.test(v.lang))
               || availableVoices.find(v=>/^pt/i.test(v.lang))
               || availableVoices[0] || null;
  }
}
if(SUPPORTED_TTS){
  refreshVoices();
  speechSynthesis.onvoiceschanged = refreshVoices;
  // Algumas plataformas (Chrome) só listam vozes após primeira interação — retry algumas vezes
  let retries=0;
  const interval = setInterval(()=>{ refreshVoices(); if(availableVoices.length || ++retries>10) clearInterval(interval); }, 300);
}

// Aquece motor TTS (Chrome precisa de utterance "vazia" pós-interação pra liberar voz na primeira fala)
function warmupTTS(){
  if(!SUPPORTED_TTS) return;
  try{
    const u = new SpeechSynthesisUtterance(' ');
    u.volume = 0; u.rate = 1;
    speechSynthesis.speak(u);
  }catch{}
}

// Divide em frases curtas (mantém pontuação). Resultados vazios são descartados.
function splitSentences(text){
  const parts = text.split(/(?<=[.!?])\s+/).map(s=>s.trim()).filter(Boolean);
  // Junta fragmentos < 12 chars no anterior (evita "Pneuzero." sozinho)
  const out=[];
  for(const p of parts){
    if(out.length && p.length<12){ out[out.length-1] += ' ' + p; }
    else out.push(p);
  }
  return out.length ? out : [text];
}

function clearTimers(){ clearTimeout(advTimer); clearTimeout(gapTimer); advTimer=null; gapTimer=null; }

function stopSpeech(){
  clearTimers();
  if(SUPPORTED_TTS){ try{ speechSynthesis.cancel(); }catch{} }
  currentUtter=null;
}

// Fala UMA sentença real via TTS. Retorna Promise<void>.
function speakOne(sentence){
  return new Promise(resolve=>{
    if(!SUPPORTED_TTS || muted || !getUseVoice()){
      const ms = Math.max(800, sentence.length * FALLBACK_CHAR_MS);
      advTimer = setTimeout(resolve, ms);
      return;
    }
    try{
      const u = new SpeechSynthesisUtterance(sentence);
      u.lang = 'pt-BR';
      if(chosenVoice) u.voice = chosenVoice;
      u.rate = getRate();
      u.pitch = 1.0;
      u.volume = 1.0;
      let done=false;
      const finish = () => { if(done) return; done=true; clearTimeout(advTimer); currentUtter=null; resolve(); };
      u.onend = finish;
      u.onerror = finish;
      // Safety net: força fim se TTS não responder (chrome bug ocasional)
      const estMs = Math.max(1200, (sentence.length / getRate()) * 65) + 2500;
      advTimer = setTimeout(finish, estMs);
      currentUtter = u;
      speechSynthesis.speak(u);
    }catch(e){
      const ms = Math.max(800, sentence.length * FALLBACK_CHAR_MS);
      advTimer = setTimeout(resolve, ms);
    }
  });
}

// Fala texto inteiro de um step (quebrado em sentenças).
async function speakStep(text){
  const sentences = splitSentences(text);
  for(let i=0;i<sentences.length;i++){
    if(!playing) return;
    await speakOne(sentences[i]);
    if(!playing) return;
    if(i < sentences.length-1){
      await new Promise(r => { gapTimer = setTimeout(r, GAP_SENTENCE_MS); });
    }
  }
}

// ===== Scenes / Steps =====
function buildChapters(){
  chapters.innerHTML = scenes.map((s,i)=>`<div class="ch" data-i="${i}">${s.badge}</div>`).join('');
  chapters.querySelectorAll('.ch').forEach(c=>c.onclick=()=>{
    stopSpeech(); si=+c.dataset.i; ti=0; playing=true;
    document.getElementById('play').textContent='⏸'; runStep(true);
  });
}
function markChapters(){
  chapters.querySelectorAll('.ch').forEach((c,i)=>{
    c.classList.toggle('cur', i===si);
    c.classList.toggle('done', i<si);
  });
}
function renderScene(){
  app.innerHTML = scenes[si].render();
  badge.textContent = scenes[si].badge;
  markChapters();
  tlabel.textContent = `Cena ${si+1}/${scenes.length}`;
  const cur = chapters.querySelector('.ch.cur');
  if(cur && cur.scrollIntoView) cur.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'});
}
function clearHL(){ app.querySelectorAll('.hl').forEach(e=>e.classList.remove('hl')); }
function applyHL(id){ clearHL(); if(id){ const el=document.getElementById(id); if(el) el.classList.add('hl'); } }

async function runStep(forceRender){
  const sc = scenes[si];
  const step = sc.steps[ti];
  const sceneChanged = forceRender;
  if(forceRender){
    renderScene();
    // Pausa breve pro DOM assentar antes do TTS começar
    await new Promise(r=>setTimeout(r, sceneChanged ? 120 : 60));
  }
  cap.textContent = step.say;
  applyHL(step.hl);
  updateProgress();
  if(!playing) return;
  await speakStep(step.say);
  if(!playing) return;
  // Pausa pós-step antes do próximo
  const gap = (ti === sc.steps.length-1) ? GAP_SCENE_MS : GAP_STEP_MS;
  await new Promise(r => { gapTimer = setTimeout(r, gap); });
  if(!playing) return;
  nextStep();
}

function nextStep(){
  const sc = scenes[si];
  if(ti < sc.steps.length-1){ ti++; runStep(false); }
  else if(si < scenes.length-1){ si++; ti=0; runStep(true); }
  else {
    playing=false;
    document.getElementById('play').textContent='⟳';
    cap.textContent='Fim do tutorial. Bom trabalho, equipe! 🏁';
  }
}
function prevStep(){
  stopSpeech();
  if(ti>0){ ti--; } else if(si>0){ si--; ti=0; }
  runStep(true);
}
function updateProgress(){
  let total=0, done=0;
  scenes.forEach((s,i)=>{ total += s.steps.length; if(i<si) done += s.steps.length; if(i===si) done += ti; });
  prog.style.width = ((done/Math.max(1,total-1)) * 100) + '%';
}
function stop(){
  playing=false; stopSpeech();
  document.getElementById('play').textContent='▶';
}
function startPlay(){ const s=document.getElementById('start'); if(s) s.remove(); warmupTTS(); }
function play(){ startPlay(); playing=true; document.getElementById('play').textContent='⏸'; runStep(false); }
function pause(){ playing=false; stopSpeech(); document.getElementById('play').textContent='▶'; }

// ===== Bindings =====
document.getElementById('play').onclick = () => { playing ? pause() : play(); };
document.getElementById('next').onclick = () => {
  stopSpeech(); if(si<scenes.length-1){ si++; ti=0; runStep(true); }
};
document.getElementById('prev').onclick = () => {
  stopSpeech(); if(si>0||ti>0){ prevStep(); }
};
document.getElementById('mute').onclick = function(){
  muted = !muted;
  this.textContent = muted ? '🔇' : '🔊';
  if(muted) stopSpeech();
};
document.getElementById('bigplay').onclick = () => { refreshVoices(); startPlay(); play(); };

if(voiceSel){
  voiceSel.addEventListener('change', () => {
    const uri = voiceSel.value;
    chosenVoice = uri ? availableVoices.find(v=>v.voiceURI===uri) || null
                      : (availableVoices.find(v=>/pt[-_]BR/i.test(v.lang)) || availableVoices[0] || null);
    if(SUPPORTED_TTS && playing){
      // Re-fala step atual com nova voz
      stopSpeech();
      runStep(false);
    }
  });
}
if(rateSel && rateLbl){
  const updRate = () => { rateLbl.textContent = parseFloat(rateSel.value).toFixed(2) + 'x'; };
  rateSel.addEventListener('input', updRate);
  updRate();
}

document.addEventListener('keydown', e => {
  if(e.code==='Space'){ e.preventDefault(); playing?pause():play(); }
  if(e.code==='ArrowRight'){ document.getElementById('next').click(); }
  if(e.code==='ArrowLeft'){ document.getElementById('prev').click(); }
});

// Hack chrome: speechSynthesis pausa sozinho após 14-15s em conversas longas. Re-resume periódico mantém vivo.
if(SUPPORTED_TTS){
  setInterval(()=>{
    if(playing && speechSynthesis.speaking && !speechSynthesis.paused){
      try{ speechSynthesis.pause(); speechSynthesis.resume(); }catch{}
    }
  }, 10000);
}

buildChapters();
renderScene();
cap.textContent = 'Clique em ▶ para iniciar o tutorial narrado.';
</script>
